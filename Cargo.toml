[package]
name = "monitor-switch"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "Moves an MSI monitor, a Magic Keyboard and a Magic Mouse between two Macs"
license = "MIT"
publish = false

# No dependencies: the system frameworks are called directly.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
