<!doctype html>
<!-- The animation behind docs/demo.mp4 and docs/demo.gif, drawn over a photo
     of the desk (desk.jpg). It has no clock of its own: render.mjs calls
     render(t) for every frame. Open it in a browser to watch it in real time. -->
<meta charset="utf-8">
<title>monitor-switch demo</title>
<style>
  html, body { margin: 0; background: #000; }
  svg { display: block; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
</style>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7a7a"/><stop offset="0.55" stop-color="#2aa7a0"/><stop offset="1" stop-color="#f29a4a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.7"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screenClip"><rect x="358" y="118" width="524" height="302"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <image id="photo" href="desk.jpg" x="0" y="0" width="1280" height="720"/>

  <g id="scene">
    <rect width="1280" height="110" fill="url(#topShade)"/>
    <rect y="600" width="1280" height="120" fill="url(#shade)"/>

    <!-- what the monitor shows -->
    <g clip-path="url(#screenClip)">
      <g id="deskMini">
        <rect x="560" y="236" width="120" height="44" rx="12" fill="#000" opacity="0.45"/>
        <text x="620" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Mac mini</text>
      </g>
      <g id="deskBook">
        <rect x="358" y="118" width="524" height="302" fill="url(#bookWall)"/>
        <path d="M358 330 C470 270 560 340 680 300 C760 272 830 300 882 280 V420 H358 Z" fill="#0b3f4a" opacity="0.45"/>
        <rect x="358" y="118" width="524" height="14" fill="#000" opacity="0.3"/>
        <circle cx="373" cy="125.5" r="3" fill="#fff"/>
        <g><text x="384" y="128.5" font-size="8" font-weight="700" fill="#fff">Finder</text><text x="426" y="128.5" font-size="8" font-weight="500" fill="#fff">File</text><text x="458" y="128.5" font-size="8" font-weight="500" fill="#fff">Edit</text><text x="490" y="128.5" font-size="8" font-weight="500" fill="#fff">View</text><text x="522" y="128.5" font-size="8" font-weight="500" fill="#fff">Go</text><text x="544" y="128.5" font-size="8" font-weight="500" fill="#fff">Window</text><text x="586" y="128.5" font-size="8" font-weight="500" fill="#fff">Help</text></g>
        <rect x="560" y="236" width="120" height="44" rx="12" fill="#000" opacity="0.35"/>
        <text x="620" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">MacBook</text>
      </g>
      <!-- the menu bar icon -->
      <g id="menuIcon" transform="translate(786 121)">
        <rect x="0" y="0" width="11" height="7" rx="1.3" fill="none" stroke="#fff" stroke-width="1.2"/>
        <rect x="3.8" y="7.8" width="3.4" height="1.4" fill="#fff"/>
      </g>
      <!-- the panel -->
      <g id="panel">
        <rect id="panelBox" width="212" rx="10" fill="#1d1f29" opacity="0.94" stroke="#ffffff22"/>
        <g id="rowTitle" transform="translate(12 12)"></g>
        <g id="rowKb" transform="translate(12 38)"></g>
        <g id="rowMs" transform="translate(12 62)"></g>
      </g>
    </g>

    <!-- one cable per Mac, each in its own input of the monitor -->
    <path id="cableMini" d="M318 492 C380 488 420 470 470 452" fill="none" stroke="#39d6c8" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10" filter="url(#glow)"/>
    <path id="cableBook" d="M930 494 C870 488 820 470 770 452" fill="none" stroke="#ff9a5c" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10" filter="url(#glow)"/>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <g id="portMini">
        <rect x="433" y="430" width="74" height="24" rx="7" fill="#0c2a30" stroke="#39d6c8" stroke-width="1.5"/>
        <text x="470" y="447" fill="#8ff0e6">HDMI</text>
      </g>
      <g id="portBook">
        <rect x="719" y="430" width="102" height="24" rx="7" fill="#33200f" stroke="#ff9a5c" stroke-width="1.5"/>
        <text x="770" y="447" fill="#ffc9a3">DisplayPort</text>
      </g>
    </g>

    <!-- the Mac holding the keyboard and mouse -->
    <rect id="miniGlow" x="122" y="456" width="202" height="70" rx="16" fill="none" stroke="#39d6c8" stroke-width="3" filter="url(#glow)"/>
    <rect id="bookGlow" x="912" y="298" width="330" height="242" rx="14" fill="none" stroke="#ff9a5c" stroke-width="3" filter="url(#glow)"/>
    <g font-size="15" font-weight="700" text-anchor="middle" fill="#fff">
      <text x="223" y="548">Mac mini</text>
      <text x="1077" y="562">MacBook</text>
    </g>

    <!-- Bluetooth links from the keyboard and the mouse -->
    <g fill="none" stroke="#7fb2ff" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round" filter="url(#soft)">
      <path id="kbMini" d="M410 556 C350 560 300 540 270 524"/>
      <path id="kbBook" d="M758 552 C820 530 880 528 930 532"/>
      <path id="msMini" d="M812 566 C700 610 420 600 300 524"/>
      <path id="msBook" d="M880 556 C900 552 912 546 924 538"/>
    </g>
    <g fill="none" stroke="#7fb2ff" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round">
      <use href="#kbMini" id="kbMiniSharp"/><use href="#kbBook" id="kbBookSharp"/>
      <use href="#msMini" id="msMiniSharp"/><use href="#msBook" id="msBookSharp"/>
    </g>

    <text id="oneMonitor" x="640" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" letter-spacing="2">ONE MONITOR · TWO MACS · TWO INPUTS</text>

    <!-- the keys being pressed -->
    <g id="caps" font-size="17" font-weight="700" text-anchor="middle"></g>
  </g>

  <text id="caption" x="640" y="694" text-anchor="middle" font-size="22" font-weight="600" fill="#fff"></text>

  <!-- title and end cards -->
  <rect id="veil" width="1280" height="720" fill="#05060c"/>
  <g id="title" text-anchor="middle">
    <text x="640" y="320" font-size="64" font-weight="700" fill="#fff">One monitor. Two Macs.</text>
    <text x="640" y="392" font-size="40" font-weight="500" fill="#8fb4ff">One hotkey.</text>
  </g>
  <g id="end" text-anchor="middle">
    <text x="640" y="300" font-size="58" font-weight="700" fill="#fff">monitor-switch</text>
    <text x="640" y="356" font-size="25" fill="#c5cbe3">Share one monitor, keyboard and mouse between two Macs.</text>
    <text x="640" y="394" font-size="25" fill="#c5cbe3">No KVM switch. No cables to move.</text>
    <text x="640" y="460" font-size="22" font-weight="600" fill="#8fb4ff">github.com/danijar2000/monitor-switch</text>
  </g>
</svg>
<script>
const $ = id => document.getElementById(id);
const clamp = x => Math.max(0, Math.min(1, x));
// 0 before `a`, 1 after `b`, eased in between.
const ramp = (t, a, b) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
// 1 between `a` and `b`, with fades of `f` seconds at both ends.
const during = (t, a, b, f = 0.35) => Math.min(ramp(t, a, a + f), 1 - ramp(t, b - f, b));

// The timeline, in seconds. Each switch: when, whether the keyboard and
// mouse move too, which Mac it goes to, and the keys.
const SWITCHES = [
  { at: 7.4, devices: true, to: 1, keys: ["Control", "Enter"] },
  { at: 15.0, devices: true, to: 0, keys: ["Control", "Enter"] },
  { at: 20.6, devices: false, to: 1, keys: ["Control", "Shift", "Enter"] },
];
const SWITCH_TIME = 3.6;
const LENGTH = 28;
const CAPTIONS = [
  [2.9, 7.0, "Both Macs stay plugged into one monitor: the Mac mini on HDMI, the MacBook on DisplayPort."],
  [7.0, 8.6, "Press Control + Enter."],
  [8.6, 12.0, "The monitor changes its input, and the keyboard and mouse pair with the MacBook."],
  [12.0, 14.6, "Everything is on the MacBook. No KVM switch, no cables to move."],
  [14.6, 19.8, "Press it again to go back to the Mac mini."],
  [20.0, 24.6, "Control + Shift + Enter moves only the monitor, to look at the other Mac."],
];
const NAMES = ["Mac mini", "MacBook"];

function check(done, t) {
  if (done) return `<circle cx="7" cy="7" r="7" fill="#34c759"/><path d="M3.6 7.3l2.3 2.3 4.5-4.8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<circle cx="7" cy="7" r="5.5" fill="none" stroke="#ffffff33" stroke-width="2"/>
          <path d="M7 1.5a5.5 5.5 0 0 1 5.5 5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" transform="rotate(${(t * 540) % 360} 7 7)"/>`;
}
function row(id, done, text, bold, t) {
  $(id).innerHTML = text === "" ? "" :
    check(done, t) + `<text x="22" y="11.5" font-size="${bold ? 11.5 : 11}" font-weight="${bold ? 700 : 500}" fill="#fff">${text}</text>`;
}

function render(t) {
  // Where everything is: 0 on the Mac mini, 1 on the MacBook.
  let monitor = 0, keyboard = 0, mouse = 0, panel = 0, active = null, progress = 0;
  for (const s of SWITCHES) {
    const p = (t - s.at) / SWITCH_TIME;
    const from = 1 - s.to;
    const move = (a, b) => from + (s.to - from) * ramp(p, a, b);
    if (p >= 0) {
      monitor = move(0.12, 0.42);
      if (s.devices) { keyboard = move(0.2, 0.52); mouse = move(0.48, 0.8); }
    }
    const shown = during(t, s.at, s.at + SWITCH_TIME + 1.3, 0.3);
    if (shown > 0) { panel = shown; active = s; progress = p; }
  }

  $("deskMini").style.opacity = 1 - monitor;
  $("deskBook").style.opacity = monitor;
  $("cableMini").style.opacity = 0.25 + 0.75 * (1 - monitor);
  $("cableBook").style.opacity = 0.25 + 0.75 * monitor;
  for (const id of ["cableMini", "cableBook"]) $(id).style.strokeDashoffset = -t * 50;
  $("portMini").style.opacity = 0.5 + 0.5 * (1 - monitor);
  $("portBook").style.opacity = 0.5 + 0.5 * monitor;
  const links = { kbMini: 1 - keyboard, kbBook: keyboard, msMini: 1 - mouse, msBook: mouse };
  for (const [id, value] of Object.entries(links)) {
    for (const element of [$(id), $(id + "Sharp")]) {
      element.style.opacity = value;
      element.style.strokeDashoffset = -t * 30;
    }
  }
  const held = (keyboard + mouse) / 2;
  $("miniGlow").style.opacity = 1 - held;
  $("bookGlow").style.opacity = held;
  // The menu bar icon is dimmed on the Mac that does not hold the devices.
  $("menuIcon").style.opacity = Math.abs(monitor - held) < 0.5 ? 0.95 : 0.4;

  $("panel").style.opacity = panel;
  if (active) {
    // One row when only the monitor moves.
    const height = active.devices ? 88 : 38;
    $("panelBox").setAttribute("height", height);
    $("panel").setAttribute("transform", `translate(658 ${410 - height})`);
    const name = NAMES[active.to];
    if (active.devices) {
      row("rowTitle", progress > 0.86, progress > 0.86 ? `Switched to ${name}` : `Switching to ${name}`, true, t);
      row("rowKb", progress > 0.54, "Magic Keyboard · 50%", false, t);
      row("rowMs", progress > 0.82, "Magic Mouse · 82%", false, t);
    } else {
      row("rowTitle", progress > 0.5, progress > 0.5 ? `The monitor shows ${name}` : `Moving the monitor to ${name}`, true, t);
      row("rowKb", true, "", false, t);
      row("rowMs", true, "", false, t);
    }
  }

  // The keys, shown from a little before each switch.
  let caps = "";
  for (const s of SWITCHES) {
    const shown = during(t, s.at - 0.9, s.at + 1.0, 0.25);
    if (shown <= 0) continue;
    const down = during(t, s.at - 0.25, s.at + 0.35, 0.12);
    const widths = s.keys.map(key => 32 + key.length * 10);
    let x = 640 - (widths.reduce((a, b) => a + b, 0) + (s.keys.length - 1) * 24) / 2;
    s.keys.forEach((key, index) => {
      const w = widths[index];
      caps += `<g opacity="${shown}" transform="translate(0 ${down * 3})">
        <rect x="${x}" y="${594 + 4 * (1 - down)}" width="${w}" height="40" rx="9" fill="#0b0d16"/>
        <rect x="${x}" y="594" width="${w}" height="40" rx="9" fill="${down > 0.5 ? "#8fb4ff" : "#f4f6fb"}"/>
        <text x="${x + w / 2}" y="620" fill="#151826">${key}</text></g>`;
      if (index < s.keys.length - 1)
        caps += `<text x="${x + w + 12}" y="620" fill="#fff" opacity="${shown}">+</text>`;
      x += w + 24;
    });
  }
  $("caps").innerHTML = caps;

  let caption = "", captionShown = 0;
  for (const [from, to, text] of CAPTIONS) {
    const shown = during(t, from, to, 0.3);
    if (shown > captionShown) { captionShown = shown; caption = text; }
  }
  $("caption").textContent = caption;
  $("caption").style.opacity = captionShown;

  const title = 1 - ramp(t, 2.1, 2.7), end = ramp(t, 25.2, 25.8);
  $("title").style.opacity = title;
  $("end").style.opacity = end;
  // The photo shows through the cards, dimmed.
  $("veil").style.opacity = 0.72 * Math.max(title, end);
  $("scene").style.opacity = Math.min(ramp(t, 2.5, 3.2), 1 - ramp(t, 24.6, 25.2));
}

window.LENGTH = LENGTH;
window.render = render;
// The photo must be loaded before a frame is taken.
window.READY = new Promise(done => {
  const photo = new Image();
  photo.onload = photo.onerror = () => done(true);
  photo.src = "desk.jpg";
});
// Watched in a browser: play in real time, over and over.
if (!navigator.webdriver && !location.hash.includes("still")) {
  const start = performance.now();
  const frame = now => { render(((now - start) / 1000) % LENGTH); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
} else {
  render(0);
}
</script>
